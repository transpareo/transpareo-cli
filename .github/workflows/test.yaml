# Build, vet, test and lint on every pull request and on pushes to main.
# The matrix covers the three release platforms and the current and
# previous Go minor versions. The go directive in go.mod decides whether
# the older toolchain runs the build itself or fetches the newer one
# through GOTOOLCHAIN.
name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: go ${{ matrix.go }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        go:
          - "1.27.x"
          - "1.26.x"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # The race detector needs a C toolchain on Windows, which the
      # runner image does not guarantee, so Windows runs without it.
      - name: Test with the race detector
        if: runner.os != 'Windows'
        run: go test -race -coverprofile=coverage.out ./...

      # PowerShell splits the -coverprofile option at its dot, so
      # the step runs in bash on Windows too.
      - name: Test
        if: runner.os == 'Windows'
        shell: bash
        run: go test -coverprofile=coverage.out ./...

      - name: Run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      # Vulnerability scanning depends on the module graph, not on the
      # platform, so one runner per Go version is enough.
      - name: Run govulncheck
        if: runner.os == 'Linux'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # A command that exists in the base branch's surface.json must
      # still exist: removing or renaming one breaks scripts and needs
      # a major version, which the "major" label on the pull request
      # declares.
      - name: Check the command surface against the base branch
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if ! git show "origin/${{ github.base_ref }}:surface.json" \
              > "$RUNNER_TEMP/base-surface.json" 2>/dev/null; then
            echo "No surface.json in the base branch; nothing to compare."
            exit 0
          fi
          removed=$(python3 - "$RUNNER_TEMP/base-surface.json" surface.json <<'PY'
          import json, sys
          base = {c["path"] for c in json.load(open(sys.argv[1]))}
          head = {c["path"] for c in json.load(open(sys.argv[2]))}
          print("\n".join(sorted(base - head)))
          PY
          )
          if [ -z "$removed" ]; then
            echo "No command was removed."
            exit 0
          fi
          echo "Commands removed or renamed:"
          echo "$removed"
          if echo '${{ toJSON(github.event.pull_request.labels.*.name) }}' \
              | grep -q '"major"'; then
            echo "The pull request carries the major label; allowed."
            exit 0
          fi
          echo "Removing a command needs a major version: add the" \
            "major label to the pull request."
          exit 1

      # Generated code is committed. Regenerating must not change any
      # tracked file and must not leave new untracked files behind.
      - name: Check that generated code is current
        if: runner.os == 'Linux'
        run: |
          go generate ./...
          git diff --exit-code
          if [ -n "$(git status --porcelain)" ]; then
            echo "go generate produced files that are not committed:"
            git status --porcelain
            exit 1
          fi
