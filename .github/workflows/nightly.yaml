# Nightly drift checks against the vendored specification and the
# command surface, plus the end-to-end run.
#
# The spec job downloads the live OpenAPI document and the assistant
# tool catalogue from the test host named by the TRANSPAREO_TEST_HOST
# secret, replaces what carries host-specific values with the neutral
# form used in spec/, and compares. On a difference it vendors the new
# documents, regenerates the code, runs the tests and opens a pull
# request with the result, so the maintainer reviews a diff instead of
# doing the update by hand. The repository setting "Allow GitHub
# Actions to create and approve pull requests" must be on.
#
# Both documents travel together: the catalogue names the
# specification version it was built from, and the parity test
# refuses to compare a catalogue and a specification that disagree.
#
# The surface job rebuilds the command tree and compares it with
# surface.json, the projection of the tree that scripts rely on: the
# paths, arguments and option names, without the prose that may change.
# A command that is in the snapshot and no longer in the tree fails the
# job, because removing or renaming one breaks scripts.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec:
    name: specification drift
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Forks and local mirrors usually do not have the secret. The job
      # then reports that and finishes green instead of failing. On this
      # repository a missing secret is a broken job, not a fork: without
      # it the comparison never runs, both vendored documents go stale
      # together, and every test that compares them with each other goes
      # on passing. That is the silence this whole job exists to break,
      # so here it fails instead.
      - name: Fetch the live specification and tool catalogue
        id: fetch
        env:
          TRANSPAREO_TEST_HOST: ${{ secrets.TRANSPAREO_TEST_HOST }}
          CANONICAL: transpareo/transpareo-cli
        run: |
          set -euo pipefail
          if [ -z "${TRANSPAREO_TEST_HOST}" ]; then
            if [ "${GITHUB_REPOSITORY}" = "${CANONICAL}" ]; then
              echo "TRANSPAREO_TEST_HOST is not set. Nothing can be" \
                "compared, and the vendored documents agree with each" \
                "other whether or not they are current. Restore the" \
                "secret." >&2
              exit 1
            fi
            echo "TRANSPAREO_TEST_HOST is not set; skipping the" \
              "specification comparison."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Both documents are served through a shared cache whose key
          # takes in the query string, so a bare fetch can answer from
          # an entry older than the code the host is running, and this
          # job would vendor what that entry held rather than what the
          # host renders. reload=1 is the supported bypass and goes to
          # the application; an arbitrary parameter would only buy an
          # entry of this job's own.
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/live.json" \
            "https://${TRANSPAREO_TEST_HOST}/apidocs/openapi.json?reload=1"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/live-tools.json" \
            "https://${TRANSPAREO_TEST_HOST}/apidocs/mcp-tools.json?reload=1"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Neutralise host-specific fields
        if: steps.fetch.outputs.available == 'true'
        run: |
          python3 - "$RUNNER_TEMP/live.json" \
            "$RUNNER_TEMP/live-normalised.json" <<'PY'
          import json
          import sys

          source, target = sys.argv[1], sys.argv[2]
          with open(source, encoding="utf-8") as handle:
              document = json.load(handle)

          document["info"]["title"] = "Transpareo API"
          document["info"]["contact"] = {
              "name": "Transpareo Support",
              "url": "https://transpareo.com",
          }
          document["servers"] = [
              {
                  "url": "/api",
                  "description": (
                      "API root (the v1 version is selected via the "
                      "Accept header, not the URL path)"
                  ),
              }
          ]
          flows = document["components"]["securitySchemes"]["oauth2"]["flows"]
          flows["clientCredentials"]["tokenUrl"] = "/api/oauth/token"

          with open(target, "w", encoding="utf-8") as handle:
              json.dump(document, handle, indent=2, ensure_ascii=False)
              handle.write("\n")
          PY

      # Every tool description ends with a link into the guide of
      # whichever host answered. The vendored catalogue carries the
      # host-neutral form, which is also what the digest covers.
      - name: Take the guide links out of the tool catalogue
        if: steps.fetch.outputs.available == 'true'
        run: |
          python3 - "$RUNNER_TEMP/live-tools.json" \
            "$RUNNER_TEMP/live-tools-normalised.json" <<'PY'
          import json
          import re
          import sys

          source, target = sys.argv[1], sys.argv[2]
          with open(source, encoding="utf-8") as handle:
              document = json.load(handle)

          guide = re.compile(r"\nSee https?://\S+/apidocs/guide#\S+$")
          for tool in document["tools"]:
              description = tool.get("description")
              if description:
                  tool["description"] = guide.sub("", description)

          with open(target, "w", encoding="utf-8") as handle:
              json.dump(document, handle, indent=2, ensure_ascii=False)
              handle.write("\n")
          PY

      # Either document differing vendors both, so the version the
      # catalogue names always matches the specification beside it.
      - name: Compare with the vendored documents
        id: compare
        if: steps.fetch.outputs.available == 'true'
        run: |
          changed=false
          if diff -u spec/openapi.json "$RUNNER_TEMP/live-normalised.json"; then
            echo "spec/openapi.json matches the live specification."
          else
            echo "spec/openapi.json differs from the live specification."
            changed=true
          fi
          if diff -u spec/mcp-tools.json \
            "$RUNNER_TEMP/live-tools-normalised.json"; then
            echo "spec/mcp-tools.json matches the live catalogue."
          else
            echo "spec/mcp-tools.json differs from the live catalogue."
            changed=true
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          if [ "${changed}" = "true" ]; then
            cp "$RUNNER_TEMP/live-normalised.json" spec/openapi.json
            cp "$RUNNER_TEMP/live-tools-normalised.json" spec/mcp-tools.json
            version=$(python3 -c \
              'import json,sys; print(json.load(open(sys.argv[1]))["info"]["version"])' \
              spec/openapi.json)
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.compare.outputs.changed == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: true

      # The tests may fail on a new specification, for example when a
      # new operation is not yet classified for the MCP server. The
      # result goes into the pull request body either way.
      - name: Regenerate and test
        id: regenerate
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -o pipefail
          # The registry first: `go generate ./...` walks the
          # packages in path order, so internal/cli would render
          # the surface, the reference and the skill from the
          # registry of the previous specification and only then
          # rebuild it.
          go generate ./internal/registry/
          go generate ./...
          if go test ./... 2>&1 | tee "$RUNNER_TEMP/test.log"; then
            echo "result=passed" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "tests<<EOF"
            tail -n 40 "$RUNNER_TEMP/test.log"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open a pull request
        if: steps.compare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: spec/vendor-${{ steps.compare.outputs.version }}
          title: "Vendor specification ${{ steps.compare.outputs.version }}"
          commit-message: |
            Vendor specification ${{ steps.compare.outputs.version }}

            - spec/openapi.json and spec/mcp-tools.json fetched from
              the test tenant and neutralised
            - generated code, surface.json and docs/cli.md refreshed
          body: |
            The live specification or the live tool catalogue differs
            from the vendored one. This pull request vendors version
            ${{ steps.compare.outputs.version }}, regenerates the code,
            the surface snapshot and the command reference.

            Tests after regeneration: **${{ steps.regenerate.outputs.result }}**

            ```
            ${{ steps.regenerate.outputs.tests }}
            ```
          labels: specification
          delete-branch: true

  surface:
    name: command surface drift
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Without a snapshot there is nothing to compare, so the job only
      # says so. With one, the snapshot test rebuilds the tree, names
      # every command and option the snapshot has and the tree lacks,
      # and fails on any other difference.
      - name: Compare the command tree with surface.json
        run: |
          set -euo pipefail
          if [ ! -f surface.json ]; then
            echo "no surface snapshot yet"
            exit 0
          fi
          go test -v -run '^TestSurfaceSnapshotIsCurrent$' ./internal/cli/ \
            | tee "$RUNNER_TEMP/surface.log"
          # A renamed test leaves `go test -run` with nothing to run and
          # a green exit, which would retire this job in silence.
          grep -q '^--- PASS: TestSurfaceSnapshotIsCurrent' \
            "$RUNNER_TEMP/surface.log"

  # The end-to-end suite runs against the test tenant with the
  # consumer stored as secrets. It creates and deletes its own
  # records. Without the secrets a fork reports that and finishes
  # green; on this repository they are missing only because
  # something broke, and a green run that checked nothing is worse
  # than a red one.
  end-to-end:
    name: end-to-end checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: true

      - name: Run the end-to-end suite
        env:
          TRANSPAREO_TEST_HOST: ${{ secrets.TRANSPAREO_TEST_HOST }}
          TRANSPAREO_TEST_CLIENT_ID: ${{ secrets.TRANSPAREO_TEST_CLIENT_ID }}
          TRANSPAREO_TEST_CLIENT_SECRET: ${{ secrets.TRANSPAREO_TEST_CLIENT_SECRET }}
          TRANSPAREO_TEST_READONLY_CLIENT_ID: ${{ secrets.TRANSPAREO_TEST_READONLY_CLIENT_ID }}
          TRANSPAREO_TEST_READONLY_CLIENT_SECRET: ${{ secrets.TRANSPAREO_TEST_READONLY_CLIENT_SECRET }}
          TRANSPAREO_TEST_SECOND_HOST: ${{ secrets.TRANSPAREO_TEST_SECOND_HOST }}
          CANONICAL: transpareo/transpareo-cli
        run: |
          set -euo pipefail
          if [ -z "${TRANSPAREO_TEST_CLIENT_ID}" ]; then
            if [ "${GITHUB_REPOSITORY}" = "${CANONICAL}" ]; then
              echo "TRANSPAREO_TEST_CLIENT_ID is not set, so nothing ran" \
                "against a real host. Restore the secret." >&2
              exit 1
            fi
            echo "TRANSPAREO_TEST_CLIENT_ID is not set; skipping."
            exit 0
          fi
          go test -tags e2e -v ./test/e2e/
