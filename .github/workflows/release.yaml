# Builds and publishes a release for every v* tag.
#
# The drift job runs first and refuses a tag whose embedded
# specification has fallen behind the one the test host serves. The
# nightly job reports that drift every night, but four releases went
# out on a four-versions-old document while it did, because a pull
# request nobody merges is not a guard. Nothing is built until this
# passes, and a host it cannot reach fails the job too.
#
# The goreleaser job produces the archives, packages, checksum file,
# SBOMs and the keyless Sigstore bundle of the checksum file, pushes the
# signing endpoint's container image to the GitHub registry and signs it,
# and pushes the Homebrew cask and Scoop manifest to their taps. The
# provenance job then hands the checksum file to the SLSA generic
# generator, which signs a SLSA level 3 provenance statement for every
# archive listed in it and uploads it to the same GitHub release.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  packages: read

jobs:
  drift:
    name: specification drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Fails when the embedded document is more than one minor version
      # behind, and equally when it could not find out, which includes
      # the secret being gone. The reason is on standard error.
      - name: Measure the embedded specification against the live one
        env:
          TRANSPAREO_TEST_HOST: ${{ secrets.TRANSPAREO_TEST_HOST }}
        run: go run ./spec/drift

  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    needs:
      - drift
    permissions:
      contents: write
      id-token: write
      # Pushing the signer image to ghcr.io.
      packages: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      # The image only copies binaries that are already built, so
      # buildx assembles both architectures without emulation.
      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the GitHub container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

      # The checksum file already has sha256sum layout (one
      # "<digest>  <file name>" line per archive), which is exactly the
      # subject list the SLSA generator expects, base64-encoded.
      - name: Encode the checksum file as provenance subjects
        id: hash
        run: |
          set -euo pipefail
          checksums=$(ls dist/transpareo_*_checksums.txt)
          echo "hashes=$(base64 -w0 < "$checksums")" >> "$GITHUB_OUTPUT"

  provenance:
    name: provenance
    needs:
      - goreleaser
    permissions:
      actions: read
      contents: write
      id-token: write
    # The generator refuses a commit reference ("Expected ref of the
    # form refs/tags/vX.Y.Z"): it fetches its own builder by that
    # tag and verifies it against the release, so the tag is the
    # pin here, unlike every other action in these workflows.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.goreleaser.outputs.hashes }}
      upload-assets: true
